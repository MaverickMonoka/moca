<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOCA — Mobile Commerce Africa</title>
<meta name="description" content="Business operating system for African SMEs: point of sale, stock, WhatsApp orders, reports, AI advisor and loan readiness.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOCA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1a1f2b;--line:#252b38;--text:#f4f5f7;--muted:#9aa3b2;--amber:#f59e0b;--amber2:#ffb936;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--side:236px;--nav:64px;box-sizing:border-box}
html{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.sg{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:#0e1118;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk";padding:4px 10px 16px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--amber);color:#1a1200;display:grid;place-items:center;font-weight:700;font-size:14px}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500}
.ni:hover{background:#ffffff08;color:var(--text)}
.ni.on{background:#f59e0b1f;color:var(--amber)}
.ni svg,.bn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{padding:20px 22px 40px;max-width:1080px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:24px}
.top .sub{color:var(--muted);font-size:13px}
.bn-wrap{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi strong{font:700 24px "Space Grotesk";display:block;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--green)}.dn{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:#ffffff0a;border-color:#3a4356}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1200}.btn.pri:hover{background:var(--amber2)}
.btn.red{color:var(--red)}.btn.sm{padding:6px 11px;font-size:13px}.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:600}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#22c55e22;color:var(--green);font-weight:600;white-space:nowrap}
.pill.a{background:#f59e0b22;color:var(--amber)}.pill.r{background:#ef444422;color:var(--red)}.pill.b{background:#60a5fa22;color:var(--blue)}.pill.g{background:#ffffff14;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid #f59e0b88;border-color:transparent}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .m{color:var(--muted);font-size:12px}
.grow{flex:1;min-width:0}
.tr{text-align:right}
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px;font-size:18px}
.empty .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chart{width:100%;height:auto;display:block}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}
/* POS */
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px;transition:.15s}
.pt:hover{border-color:#f59e0b77}.pt:active{transform:scale(.97)}
.pt[disabled]{opacity:.4;cursor:not-allowed}
.pt b{font-size:14px;line-height:1.25}.pt .pr{color:var(--amber);font:700 15px "Space Grotesk";margin-top:auto}.pt .st{font-size:11px;color:var(--muted)}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:16px}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:4px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.tot{display:flex;justify-content:space-between;font:700 22px "Space Grotesk";margin:12px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{border-color:var(--amber);color:var(--amber);background:#f59e0b14}
.cartbar{display:none}
/* modal + toast */
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:16px;overflow:auto}
#modal.open{display:grid}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto;position:relative}
.box h3{font-size:20px;margin-bottom:4px}.box .sub{color:var(--muted);font-size:13px;margin:0 0 6px}
.x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
.mact{display:flex;gap:10px;margin-top:18px}.mact .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222836;border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
textarea.mono{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:180px}
/* onboarding */
.ob{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 340px at 50% 0,#f59e0b26,transparent 70%)}
.ob .box{max-width:440px;max-height:none}
.ob .hl{font:700 44px "Space Grotesk";color:var(--amber);line-height:1}
.gauge{display:grid;place-items:center}.gauge svg{width:220px}
.tip{border-left:3px solid var(--amber);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px}
.tip.warn{border-color:var(--red)}.tip.good{border-color:var(--green)}
.tip b{display:block;margin-bottom:2px}.tip p{margin:0;color:var(--muted);font-size:14px}
.tip .btn{margin-top:8px}
.lock{text-align:center;padding:36px 18px}
.lock h3{font-size:20px;margin-bottom:6px}.lock p{color:var(--muted);max-width:420px;margin:0 auto 16px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .card{cursor:pointer;display:flex;flex-direction:column;gap:8px}
.menu svg{width:24px;height:24px;stroke:var(--amber);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:500;font-size:12px}td.n,th.n{text-align:right}
@media(max-width:899px){
 .app{display:block}aside{display:none}
 main{padding:14px 14px calc(var(--nav) + 90px + env(safe-area-inset-bottom,0px))}
 .bn-wrap{display:flex;position:fixed;left:0;right:0;bottom:0;background:#0e1118f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
 .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer}
 .bn.on{color:var(--amber)}
 .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
 .pos{display:block}
 .cart{position:fixed;left:0;right:0;bottom:0;border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;z-index:70;transform:translateY(105%);transition:.28s;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 .cart.open{transform:none}
 .cartbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--amber);color:#1a1200;border:0;border-radius:14px;padding:14px 18px;font-weight:700;justify-content:space-between;cursor:pointer;box-shadow:0 10px 30px #000a}
 .cartbar[hidden]{display:none}
 #toast{bottom:150px}
}
@media(max-width:520px){.top h1{font-size:21px}.kpi strong{font-size:20px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var K='moca.app.v1',DAY=864e5;
var S=null,ui={view:'home',cat:'All',q:'',cart:{},dtype:'R',dval:'',method:'Cash',tender:'',cashier:null,cartOpen:false,ofilter:'Open',period:30,mk:'All',slow:false,ol:[]};
var PL={starter:{n:'Starter',price:149,prod:100,users:1,ai:0,mk:0},growth:{n:'Growth',price:399,prod:1e9,users:5,ai:1,mk:0},pro:{n:'Pro',price:899,prod:1e9,users:1e9,ai:1,mk:1},enterprise:{n:'Enterprise',price:0,prod:1e9,users:1e9,ai:1,mk:1}};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var R=function(n){return 'R '+(Math.round(n*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})};
var R0=function(n){return 'R '+Math.round(n).toLocaleString('en-ZA')};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var sod=function(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
var IC={home:'<path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/>',pos:'<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.5 12h11L21 7H6"/>',stock:'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/>',orders:'<path d="M21 12a9 9 0 1 1-3.6-7.2L21 3v5h-5"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',reports:'<path d="M4 20V4M4 20h16M9 20v-8M14 20V8M19 20v-5"/>',advisor:'<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>',loan:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M22 21c0-3-1.7-5-4-5.7"/>',market:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'};
var ic=function(n){return '<svg viewBox="0 0 24 24">'+IC[n]+'</svg>'};
var NAV=[['home','Home'],['pos','Sell'],['stock','Stock'],['orders','Orders'],['reports','Reports'],['advisor','AI Advisor'],['loan','Loan Readiness'],['staff','Staff'],['market','MOCA Market'],['settings','Settings']];
var BN=[['home','Home'],['pos','Sell'],['stock','Stock'],['orders','Orders'],['more','More']];

/* ---------- storage ---------- */
function load(){try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){S=null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2400)}
function modal(h){var m=$('#modal');m.innerHTML='<div class="box"><button class="x" data-a="close">×</button>'+h+'</div>';m.classList.add('open')}
function closeM(){var m=$('#modal');m.classList.remove('open');m.innerHTML=''}
function plan(){return PL[S.plan]||PL.growth}
function newState(o){return {v:1,biz:{name:o.name,owner:o.owner,phone:o.phone||'',type:o.type||'',reg:''},plan:o.plan||'growth',products:[],sales:[],orders:[],staff:[{id:uid(),name:o.owner,role:'Owner'}],quotes:[],seq:1,oseq:1}}

/* ---------- data helpers ---------- */
function cost(s){return s.items.reduce(function(a,i){return a+i.cost*i.qty},0)}
function inR(a,b){return S.sales.filter(function(s){return s.ts>=a&&s.ts<b})}
function sum(arr,f){return arr.reduce(function(a,x){return a+f(x)},0)}
function tot(arr){return sum(arr,function(s){return s.total})}
function prof(arr){return sum(arr,function(s){return s.total-cost(s)})}
function series(days,step){var out=[],t0=sod(Date.now()),n=Math.ceil(days/step);for(var i=n-1;i>=0;i--){var a=t0-i*step*DAY-(step-1)*DAY,b=a+step*DAY,d=new Date(a);out.push({l:step===1?(days<=7?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]:d.getDate()):(d.getDate()+'/'+(d.getMonth()+1)),v:tot(inR(a,b))})}return out}
function velocity(pid,days){var a=Date.now()-days*DAY,q=0;S.sales.forEach(function(s){if(s.ts>=a)s.items.forEach(function(i){if(i.pid===pid)q+=i.qty})});return q/days}
function soldSince(pid,days){var a=Date.now()-days*DAY;return S.sales.some(function(s){return s.ts>=a&&s.items.some(function(i){return i.pid===pid})})}
function low(){return S.products.filter(function(p){return p.stock<=p.reorder})}
function prod(id){return S.products.find(function(p){return p.id===id})}
function chart(d){var h=130,w=d.length*(d.length>16?26:44),bw=d.length>16?16:26,mx=Math.max(1,Math.max.apply(null,d.map(function(x){return x.v})));var s='<svg class="chart" viewBox="0 0 '+w+' '+(h+34)+'" role="img" aria-label="Sales chart">';d.forEach(function(x,i){var bh=Math.max(2,x.v/mx*h),cx=i*(w/d.length)+(w/d.length)/2;s+='<rect x="'+(cx-bw/2)+'" y="'+(h-bh+16)+'" width="'+bw+'" height="'+bh+'" rx="4" fill="#f59e0b" opacity="'+(x.v?1:.25)+'"/>';if(d.length<=8&&x.v)s+='<text x="'+cx+'" y="'+(h-bh+11)+'" text-anchor="middle" font-size="9" fill="#9aa3b2">'+Math.round(x.v)+'</text>';if(d.length<=8||i%3===0)s+='<text x="'+cx+'" y="'+(h+30)+'" text-anchor="middle" font-size="10" fill="#9aa3b2">'+x.l+'</text>'});return s+'</svg>'}
function head(t,sub,act){return '<div class="top"><div><h1>'+t+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div><div>'+(act||'')+'</div></div>'}
function locked(t,why){return '<div class="card lock"><h3>'+t+'</h3><p>'+why+'</p><button class="btn pri" data-a="nav" data-v="settings">Change plan</button></div>'}
function empty(t,p,btns){return '<div class="card empty"><h3>'+t+'</h3><div>'+p+'</div><div class="cta">'+(btns||'')+'</div></div>'}
var EMPTYBTN='<button class="btn pri" data-a="newprod">Add product</button><button class="btn" data-a="demo">Load demo data</button>';

/* ---------- demo ---------- */
function demo(){
  var seed=11,rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647};
  var P=[['White bread 700g','Bakery',17,13.4,40,15,9],['Brown bread 700g','Bakery',16,12.6,30,12,6],['Maize meal 10kg','Groceries',119,98,14,10,5],['Cooking oil 2L','Groceries',79,66,22,8,4],['Sugar 2.5kg','Groceries',64,54.5,18,8,4],['Rice 2kg','Groceries',52,43.5,25,8,4],['Full cream milk 1L','Dairy',22,18.8,5,12,8],['Eggs tray 30','Dairy',84,71,9,6,3],['Airtime R30','Airtime',30,28.5,200,0,10],['Cold drink 2L','Drinks',28,22.5,36,12,7],['Bar soap 175g','Household',12,9,48,12,3],['Washing powder 1kg','Household',49,40,16,6,3],['Instant noodles','Groceries',7,5.2,90,30,8],['Candles 6pk','Household',38,26,18,4,0]];
  var staff=[{id:uid(),name:S.biz.owner,role:'Owner'},{id:uid(),name:'Thabo',role:'Cashier'},{id:uid(),name:'Lerato',role:'Cashier'}];
  S.staff=staff;
  S.products=P.map(function(p){return {id:uid(),name:p[0],cat:p[1],price:p[2],cost:p[3],stock:p[4],reorder:p[5],w:p[6]}});
  var pool=[];S.products.forEach(function(p){for(var i=0;i<p.w;i++)pool.push(p)});delete S.products.w;
  S.sales=[];var now=Date.now();
  for(var d=44;d>=0;d--){var dow=new Date(sod(now)-d*DAY).getDay();var n=Math.round((6+rnd()*5+(45-d)*.13)*((dow===5||dow===6)?1.35:1));
    for(var k=0;k<n;k++){var ts=Math.min(sod(now)-d*DAY+(7+rnd()*12)*36e5,now-1000*(k+1)),items=[],lines=1+Math.floor(rnd()*3);
      for(var l=0;l<lines;l++){var p=pool[Math.floor(rnd()*pool.length)];if(items.some(function(i){return i.pid===p.id}))continue;items.push({pid:p.id,name:p.name,qty:p.cat==='Airtime'?1:1+Math.floor(rnd()*3),price:p.price,cost:p.cost})}
      var sub=sum(items,function(i){return i.price*i.qty}),r=rnd();
      S.sales.push({id:uid(),no:S.seq++,ts:ts,items:items,sub:sub,disc:0,total:sub,method:r<.62?'Cash':(r<.82?'Card':'EFT'),cashier:staff[Math.floor(rnd()*3)].name,src:'pos'})}}
  S.sales.sort(function(a,b){return a.ts-b.ts});
  S.products.forEach(function(p){delete p.w});
  save();
}

/* ---------- views ---------- */
function home(){
  if(!S.products.length)return head('Welcome, '+esc(S.biz.owner),esc(S.biz.name))+empty('Let’s set up your shop','Add your products to start selling, or explore with sample data.',EMPTYBTN);
  var t0=sod(Date.now()),td=inR(t0,t0+DAY),open=S.orders.filter(function(o){return o.status!=='Delivered'&&o.status!=='Cancelled'}).length,lw=low(),ls=loanScore();
  var tip='';if(plan().ai){var a=advice()[0];if(a)tip='<div class="tip '+a.t+'"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p></div>'}
  return head('Good day, '+esc(S.biz.owner.split(' ')[0]),esc(S.biz.name)+' · '+new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'}),'<button class="btn pri" data-a="nav" data-v="pos">＋ New sale</button>')+

});
document.addEventListener('change',function(e){if(e.target.id==='cashier')ui.cashier=e.target.value;if(e.target.id==='tender')refreshPos(true);if(e.target.id==='dval')refreshPos(true)});

document.addEventListener('submit',function(e){var f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();var n=f.dataset.f,d={};Array.prototype.forEach.call(f.elements,function(x){if(x.name)d[x.name]=x.value.trim()});
  if(n==='onboard'){S=newState(d);save();ui.view='home';render();toast('Welcome to MOCA');return}
  if(n==='profile'){S.biz.name=d.name;S.biz.owner=d.owner;S.biz.phone=d.phone;S.biz.reg=d.reg;S.staff[0].name=d.owner;save();render();toast('Profile saved');return}
  if(n==='prod'){var id=f.dataset.id,o={name:d.name,cat:d.cat,price:num(d.price),cost:num(d.cost),stock:Math.max(0,Math.floor(num(d.stock))),reorder:Math.max(0,Math.floor(num(d.reorder)))};
    if(!o.name||o.price<=0){toast('Enter a name and selling price');return}
    if(id){Object.assign(prod(id),o)}else{if(S.products.length>=plan().prod){toast('Product limit reached for your plan');return}o.id=uid();S.products.push(o)}
    save();closeM();render();toast('Product saved');return}
  if(n==='restock'){var p=prod(f.dataset.id),q=Math.floor(num(d.q));if(q<=0){toast('Enter units received');return}p.stock+=q;if(num(d.c)>0)p.cost=num(d.c);save();closeM();render();toast('Stock updated');return}
  if(n==='order'){if(!ui.ol.length){toast('Add at least one item');return}
    var items=ui.ol.map(function(l){var p=prod(l.pid);return {pid:p.id,name:p.name,qty:l.qty,price:p.price,cost:p.cost}});items.forEach(function(i){prod(i.pid).stock-=i.qty});
    S.orders.push({id:uid(),no:S.oseq++,ts:Date.now(),customer:d.customer,phone:d.phone,method:d.method,items:items,total:sum(items,function(i){return i.price*i.qty}),status:'New'});save();closeM();ui.ofilter='Open';render();toast('Order created. Stock reserved');return}
  if(n==='staff'){S.staff.push({id:uid(),name:d.name,role:d.role});save();closeM();render();toast('Staff added');return}
  if(n==='quote'){S.quotes.push({ts:Date.now(),sup:f.dataset.s,item:d.item,qty:d.qty,note:d.note});save();closeM();render();toast('Quote request saved');return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
load();render();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
